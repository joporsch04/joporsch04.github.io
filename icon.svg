<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4285f4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#gradient)" stroke="none"/>
  
  <!-- Physics/Science symbol - Atom-like design -->
  <g transform="translate(16,16)">
    <!-- Electron orbits -->
    <ellipse cx="0" cy="0" rx="8" ry="3" fill="none" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="8" ry="3" fill="none" stroke="white" stroke-width="1.5" opacity="0.8" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="8" ry="3" fill="none" stroke="white" stroke-width="1.5" opacity="0.8" transform="rotate(120)"/>
    
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="2" fill="white"/>
    
    <!-- Electrons -->
    <circle cx="8" cy="0" r="1.5" fill="white"/>
    <circle cx="-4" cy="6.9" r="1.5" fill="white"/>
    <circle cx="-4" cy="-6.9" r="1.5" fill="white"/>
  </g>
</svg>